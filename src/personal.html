<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutline</title>
{{HEAD_META}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px "DM Sans",system-ui,-apple-system,sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
{{APP_CSS}}
</style>
<style id="shell-style">
/* Personal page frame: header, then the tracker in one centered column with its tabs right under the header line. */
.s-wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
.s-head{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.s-head .s-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.s-logo{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;font-size:19px;letter-spacing:-.3px}
.s-logo svg{width:22px;height:22px;flex:none}
.s-date{font-size:14px;color:var(--text-muted)}
.s-main{padding-block:0 32px}
.s-grid{max-width:680px}
@media (max-width:640px){.s-wrap{padding-inline:16px}}
</style>
</head>
<body>
<header class="s-head"><div class="s-wrap"><div class="s-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 17.5L19 6.5" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/></svg>Cutline</div><div class="s-date" id="s-date"></div></div></header>
<main class="s-main"><div class="s-wrap s-grid">
<div class="s-panel"><div id="app-root"></div></div>
</div></main>
{{APP_SCRIPT}}
</body>
</html>
