<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutline</title>
{{HEAD_META}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px "DM Sans",system-ui,-apple-system,sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
{{APP_CSS}}
</style>
<style id="shell-style">
/* Personal page frame: header, intro column and the tracker panel. Layout: one 1120px column, two columns from 900px. */
.s-wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
.s-head{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.s-head .s-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.s-logo{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;font-size:19px;letter-spacing:-.3px}
.s-logo svg{width:22px;height:22px;flex:none}
.s-date{font-size:14px;color:var(--text-muted)}
.s-main{padding-block:56px 40px}
.s-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,600px);gap:56px;align-items:start}
.s-aside{position:sticky;top:96px}
.s-aside h1{font-weight:500;font-size:clamp(36px,5vw,56px);line-height:1.04;letter-spacing:-.03em;margin:0;text-wrap:balance}
.s-lede{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.55;color:var(--text-muted);max-width:30em;margin:20px 0 0}
.s-tries{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;border-top:1px solid var(--border)}
.s-tries li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px;color:var(--text-muted)}
.s-tries code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--text);border:1px solid rgba(255,255,255,.35);padding:3px 8px;border-radius:6px;white-space:nowrap}
.s-foot{border-top:1px solid var(--border);padding-block:28px 48px;font-size:14px;color:var(--text-muted)}
@media (max-width:900px){.s-grid{grid-template-columns:minmax(0,1fr);gap:32px}.s-aside{position:static}.s-tries{display:none}}
@media (max-width:640px){.s-wrap{padding-inline:16px}.s-main{padding-block:28px}.s-lede{font-size:17px}}
</style>
</head>
<body>
<header class="s-head"><div class="s-wrap"><div class="s-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 17.5L19 6.5" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/></svg>Cutline</div><div class="s-date" id="s-date"></div></div></header>
<main class="s-main"><div class="s-wrap s-grid">
<div class="s-aside"><h1>Your log</h1>
<p class="s-lede">Type a food and an amount, check the preview, and press Enter. Your totals, history and targets are in the tabs.</p>
<ul class="s-tries"><li><code>chicken breast</code><code>179</code></li><li><code>eggs</code><code>4x</code></li><li><code>italian sausage</code><code>135</code></li><li><code>fage</code><span><code>1</code> = one cup</span></li></ul>
</div>
<div class="s-panel"><div id="app-root"></div></div>
</div></main>
<footer class="s-foot"><div class="s-wrap">Cutline &middot; your personal food diary</div></footer>
{{APP_SCRIPT}}
</body>
</html>
