  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function shiftDate(dateStr,days){ var d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function lbToKg(lb){ return lb*0.45359237; }
  function inToCm(inch){ return inch*2.54; }

  function calcBMR(p){
    var kg=lbToKg(p.weightLb||0), cm=inToCm(p.heightIn||0), age=p.age||35;
    var sexTerm = p.sex==='male'?5 : p.sex==='female'?-161 : -78;
    return 10*kg+6.25*cm-5*age+sexTerm;
  }
  function calcTargets(p){
    var bmr=calcBMR(p), tdee=bmr*(p.activity||1.2), calorieTarget=tdee-(p.deficit||0);
    var proteinG=(p.goalWeightLb||p.weightLb||0)*1;
    if(p.proteinFloorEnabled) proteinG=Math.max(proteinG,p.proteinFloorG||0);
    var netCarbG = p.netCarbLimit>0 ? p.netCarbLimit : (p.dietMode==='lowcarb'?75:25);
    var fatG=Math.max(0,(calorieTarget-proteinG*4-netCarbG*4)/9);
    return {bmr:bmr,tdee:tdee,calorieTarget:calorieTarget,proteinG:proteinG,netCarbG:netCarbG,fatG:fatG};
  }

  function dayTotals(entries){
    return entries.reduce(function(a,e){ a.cals+=e.cals; a.protein+=e.protein; a.carbs+=e.carbs; a.fiber+=e.fiber||0; a.fat+=e.fat; return a; },{cals:0,protein:0,carbs:0,fiber:0,fat:0});
  }

  // Food lookup: every word typed must appear in the name or an alias (plural-tolerant). Exact alias match ranks first.
  function findFoods(q){
    q=(q||'').toLowerCase().trim();
    if(!q) return [];
    var toks=q.split(/[\s,]+/).filter(Boolean), out=[];
    (state.customFoods||[]).concat(FOODS).forEach(function(f){
      var names=[f.n.toLowerCase()].concat((f.a||[]).map(function(a){return a.toLowerCase();}));
      var hay=names.join(' | ');
      var ok=toks.every(function(t){ return hay.indexOf(t)>-1 || hay.indexOf(t.replace(/(es|s)$/,''))>-1; });
      if(!ok) return;
      var score = names.indexOf(q)>-1 ? 0 : names.some(function(n){return n.indexOf(q)===0;}) ? 1 : 2;
      out.push({f:f,s:score,l:f.n.length});
    });
    out.sort(function(a,b){ return a.s-b.s || a.l-b.l; });
    return out.map(function(o){return o.f;});
  }

  // Amount: "179", "179g", "6oz", "1lb", or pieces ("4x", "4 eggs"). A bare number up to 12 counts as pieces for foods that have a piece size.
  function parseAmount(s,food){
    s=(s||'').toLowerCase().trim();
    var m=s.match(/^(\d*\.?\d+)\s*([a-z]*)$/);
    if(!m) return null;
    var n=parseFloat(m[1]), u=m[2], W={g:1,gram:1,grams:1,oz:28.3495,lb:453.592,lbs:453.592,kg:1000};
    if(u && W[u]!==undefined) return {g:n*W[u], label:R1(n)+u.replace('gram','g').replace('gs','g')};
    if(food && food.pc && (u || n<=12)) return {g:n*food.pc.g, label:R1(n)+' × '+food.pc.name+' ('+R(n*food.pc.g)+'g)'};
    if(u) return null;
    return {g:n, label:R1(n)+'g'};
  }

  function pieceNote(f){ if(!f.pc) return ''; var k=f.pc.g/100; return ' One '+f.pc.name+' ('+R(f.pc.g)+'g): '+R(f.cal*k)+' kcal, P '+R1(f.p*k)+'g.'; }

  function foodMacros(food,grams){
    var k=grams/100;
    return {cals:food.cal*k, protein:food.p*k, carbs:food.c*k, fiber:food.fi*k, fat:food.f*k};
  }

  // ---- Personalization from the log ----
  function resolvedName(e){ var m=findFoods(e.name)[0]; return m ? m.n : e.name; }
  function allEntries(){
    var out=[];
    Object.keys(state.days).sort().forEach(function(d){ (state.days[d]||[]).forEach(function(e){ out.push(e); }); });
    return out;
  }
  function amountFromPortion(portion){
    var m=String(portion||'').match(/^(\d+(?:\.\d+)?) × /);
    return m ? m[1]+'x' : String(portion||'');
  }
  // Foods logged at least twice, most frequent first, with the amount you log most often (ties go to the most recent).
  function usualFoods(){
    var info={};
    allEntries().forEach(function(e){
      var n=resolvedName(e), a=amountFromPortion(e.portion);
      var o=info[n]||(info[n]={n:n,count:0,amts:{}});
      o.count++; o.amts[a]=(o.amts[a]||0)+1; o.lastAmt=a;
    });
    var list=Object.keys(info).map(function(k){
      var o=info[k], best=o.lastAmt, bc=o.amts[o.lastAmt];
      Object.keys(o.amts).forEach(function(a){ if(o.amts[a]>bc){ best=a; bc=o.amts[a]; } });
      return {n:o.n,count:o.count,amt:best};
    }).filter(function(o){ return o.count>=2; });
    list.sort(function(a,b){ return b.count-a.count || (a.n<b.n?-1:1); });
    return list.slice(0,6);
  }
  function proteinFoods(){
    var cnt={};
    allEntries().forEach(function(e){ var n=resolvedName(e); cnt[n]=(cnt[n]||0)+1; });
    var out=[];
    Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).forEach(function(n){
      var f=findFoods(n)[0];
      if(f && f.n===n && f.p>=20 && out.indexOf(f)<0) out.push(f);
    });
    if(!out.length) out.push(FOODS[0]);
    return out.slice(0,2);
  }
  function gramsFor(food,proteinG){ return Math.max(5, Math.round(proteinG/(food.p/100)/5)*5); }
  function shortName(food){ return food.n.split(',')[0].toLowerCase() + (food.n.indexOf('cooked')>-1 ? ' (cooked)' : ''); }

  function loggedDays(){ return Object.keys(state.days).filter(function(d){ return (state.days[d]||[]).length>0; }).sort(); }
  function dayStats(d){ var t=dayTotals(state.days[d]||[]); return {d:d,kcal:t.cals,prot:t.protein,net:t.carbs-t.fiber,fat:t.fat,n:(state.days[d]||[]).length}; }
  function windowDays(){ var today=todayStr(); return loggedDays().filter(function(d){ return d<today; }).slice(-7); }

  function insightsHTML(t){
    var win=windowDays();
    if(win.length<3) return '<p>Insights appear after three logged days.<\/p>';
    var st=win.map(dayStats), n=st.length;
    function avg(k){ return st.reduce(function(a,s){ return a+s[k]; },0)/n; }
    var lines=[];

    var weights=state.weights||{}, wd=Object.keys(weights).sort();
    if(wd.length>=2){
      var w0=weights[wd[0]], w1=weights[wd[wd.length-1]], dlt=R1(w1-w0);
      lines.push('<p>Weight: <b>'+R1(w0)+' lb<\/b> on '+esc(prettyDate(wd[0]))+', now <b>'+R1(w1)+' lb<\/b> ('+(dlt>0?'+':'')+dlt+' lb). Goal is <b>'+R1(state.profile.goalWeightLb)+' lb<\/b>.<\/p>');
    }

    var prot=avg('prot'), hit=st.filter(function(s){ return s.prot>=t.proteinG; }).length, gap=t.proteinG-prot, top=proteinFoods()[0];
    lines.push('<p>Protein averaged <b>'+R(prot)+'g<\/b> over your last '+n+' logged days and reached <b>'+R(t.proteinG)+'g<\/b> on <b>'+hit+' of '+n+'<\/b>.' +
      (gap>0 ? ' Closing the average gap takes about <b>'+gramsFor(top,gap)+'g<\/b> more '+esc(shortName(top))+' a day.' : ' You are above your goal on average.')+'<\/p>');

    var kcal=avg('kcal'), target=t.calorieTarget;
    if(kcal<target*0.75){
      lines.push('<p>Logged intake averages <b>'+N(kcal)+'<\/b> kcal against a target of <b>'+N(target)+'<\/b>. If that is everything you eat, your deficit is about <b>'+N(t.tdee-kcal)+'<\/b> kcal a day against an estimated maintenance of <b>'+N(t.tdee)+'<\/b>, not '+N(state.profile.deficit)+'. If it is not, something is going unlogged, such as oil, sauces, drinks or snacks.<\/p>');
    } else if(kcal>target*1.1){
      lines.push('<p>Logged intake averages <b>'+N(kcal)+'<\/b> kcal, above your target of <b>'+N(target)+'<\/b>.<\/p>');
    } else {
      lines.push('<p>Logged intake averages <b>'+N(kcal)+'<\/b> kcal, close to your target of <b>'+N(target)+'<\/b>.<\/p>');
    }

    var net=avg('net'), over=st.filter(function(s){ return s.net>t.netCarbG; }).length;
    var bySrc={}, total=0;
    win.forEach(function(d){ (state.days[d]||[]).forEach(function(e){ var c=e.carbs-(e.fiber||0), nm=resolvedName(e); bySrc[nm]=(bySrc[nm]||0)+c; total+=c; }); });
    var topSrc=Object.keys(bySrc).sort(function(a,b){ return bySrc[b]-bySrc[a]; })[0];
    var share=(topSrc && total>0) ? bySrc[topSrc]/total : 0;
    lines.push('<p>Net carbs averaged <b>'+R(net)+'g<\/b> against your <b>'+R(t.netCarbG)+'g<\/b> limit, over it on <b>'+over+' of '+n+'<\/b> days.' +
      (share>=0.4 ? ' <b>'+esc(topSrc.split(',')[0])+'<\/b> supplies <b>'+R(share*100)+'%<\/b> of them.' : '')+'<\/p>');

    return lines.join('');
  }

    html += '<div class="field-grid">';
    html += '<div class="field"><label for="f-sex">Sex<\/label><select id="f-sex" data-field="sex"><option value=""'+(p.sex===''?' selected':'')+'>Not set<\/option><option value="male"'+(p.sex==='male'?' selected':'')+'>Male<\/option><option value="female"'+(p.sex==='female'?' selected':'')+'>Female<\/option><\/select><\/div>';
    html += '<div class="field"><label for="f-age">Age<\/label><input id="f-age" type="number" min="10" max="100" data-field="age" value="'+(p.age||'')+'" placeholder="e.g. 34"><\/div>';
    html += '<div class="field"><label for="f-height">Height (in)<\/label><input id="f-height" type="number" step="0.1" data-field="heightIn" value="'+p.heightIn+'"><\/div>';
    html += '<div class="field"><label for="f-weight">Current weight (lb)<\/label><input id="f-weight" type="number" step="0.1" data-field="weightLb" value="'+p.weightLb+'"><\/div>';
    html += '<div class="field"><label for="f-goal">Goal weight (lb)<\/label><input id="f-goal" type="number" step="0.1" data-field="goalWeightLb" value="'+p.goalWeightLb+'"><\/div>';
    html += '<div class="field"><label for="f-deficit">Deficit (kcal/day)<\/label><input id="f-deficit" type="number" step="25" data-field="deficit" value="'+p.deficit+'"><\/div>';
    html += '<div class="field"><label for="f-activity">Activity<\/label><select id="f-activity" data-field="activity">';
    ACTIVITY.forEach(function(a){ html += '<option value="'+a.v+'"'+(Math.abs(p.activity-a.v)<0.001?' selected':'')+'>'+esc(a.label)+'<\/option>'; });
    html += '<\/select><\/div>';
    html += '<div class="field"><label for="f-diet">Carb target<\/label><select id="f-diet" data-field="dietMode"><option value="keto"'+(p.dietMode==='keto'?' selected':'')+'>Keto (&le;25g net)<\/option><option value="lowcarb"'+(p.dietMode==='lowcarb'?' selected':'')+'>Low carb (&le;75g net)<\/option><\/select><\/div>';
    html += '<div class="field"><label for="f-netlimit">Net carb limit (g)<\/label><input id="f-netlimit" type="number" step="1" min="0" data-field="netCarbLimit" value="'+(p.netCarbLimit>0?p.netCarbLimit:'')+'" placeholder="auto ('+(p.dietMode==='lowcarb'?75:25)+')"><\/div>';
    html += '<div class="field"><label for="f-protfloor">Protein floor (g)<\/label><input id="f-protfloor" type="number" step="5" data-field="proteinFloorG" value="'+p.proteinFloorG+'" '+(p.proteinFloorEnabled?'':'disabled')+'><\/div>';
    html += '<div class="field full checkrow"><label class="checklabel"><input type="checkbox" id="f-protfloor-on" data-field="proteinFloorEnabled" '+(p.proteinFloorEnabled?'checked':'')+'> Use protein floor instead of bodyweight target (optional goal)<\/label><\/div>';
    html += '<\/div>';
    html += '<div class="targets-out">BMR <b>'+R(t.bmr)+'<\/b> kcal &middot; TDEE <b>'+R(t.tdee)+'<\/b> kcal &middot; Calorie target <b>'+R(t.calorieTarget)+'<\/b> kcal<br>' +
      'Protein target <b>'+R(t.proteinG)+'g<\/b>'+(p.proteinFloorEnabled?' (floor)':' (bodyweight)')+' &middot; Net carb limit <b>'+R(t.netCarbG)+'g<\/b>'+(p.netCarbLimit>0?' (custom)':'')+' &middot; Fat target <b>'+R(t.fatG)+'g<\/b>' +
      (weeksToGoal?('<br>At '+R1(lbPerWeek)+' lb/week, about <b>'+R1(weeksToGoal)+'<\/b> weeks to goal weight'):'') +
      '<\/div>';
    html += '<\/details><\/section>';

    html += '<div class="foot-note">Targets use the Mifflin-St Jeor formula. Food values are typical averages per 100g, cooked weight unless the name says raw. Brand items use the label for one serving. Recipes change, so check your package, and use a custom food for anything missing. Your log is private to you: it saves to your Claude account when you are signed in, and to this browser otherwise.<\/div>';

    return html;
  }

  // Round-trip safe: this function must not contain the two-character closing-tag sequence outside string literals, so the page can re-save itself.
  function buildFullDocument(currentState){
    var stateJSON = JSON.stringify(currentState).split(String.fromCharCode(60)).join('\\u003c');
    var src = boot.toString().replace(/<\//g,'<\\/');
    var body = '<title>Cutline<\/title>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">' +
      '<div id="app-root"><\/div>' +
      '<' + 'script id="state-data" type="application/json">' + stateJSON + '<' + '/script>' +
      '<' + 'script>(' + src + ')(JSON.parse(document.getElementById(\'state-data\').textContent));<' + '/script>';
    return '<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + HEAD_RESET + '<\/style><\/head><body>' + body + '<\/body><\/html>';
  }

  if(!state.customFoods) state.customFoods=[];
  if(!state.weights) state.weights={};
  var viewDate = todayStr();
  var KEY = 'cutline_share_v1';
  function adopt(s){ if(!s || !s.profile) return; state.profile=s.profile; state.customFoods=s.customFoods||[]; state.weights=s.weights||{}; state.days=s.days||{}; }
  try{ adopt(JSON.parse(localStorage.getItem(KEY)||'null')); }catch(e){}
  if(!state.days[viewDate]) state.days[viewDate] = [];

  var styleEl = $('app-style');
  if(!styleEl){ styleEl = document.createElement('style'); styleEl.id='app-style'; document.head.appendChild(styleEl); }
  styleEl.textContent = CSS;

  function updatePreview(){
    var box=$('pv'); if(!box) return;
    var fq=($('f-food')||{}).value||'', aq=($('f-amt')||{}).value||'';
    if(!fq.trim()){
      box.innerHTML='<div class="pv-hint">Type a food and an amount, like <b>chicken breast<\/b> and <b>179<\/b>, then press Enter to log it. Eggs and similar foods accept counts, like <b>4<\/b> or <b>4x<\/b>.<\/div>';
      return;
    }
    var m=findFoods(fq);
    if(!m.length){
      box.innerHTML='<div class="pv-miss">No match for &ldquo;'+esc(fq)+'&rdquo;. Add it once under custom foods below.<\/div>';
      return;
    }
    var food=m[0], head='<div class="pv-title">'+esc(food.n)+'<\/div>';
    var chips=m.slice(1,5).map(function(f){ return '<button type="button" class="chip" data-action="pick-food" data-name="'+esc(f.n)+'">'+esc(f.n)+'<\/button>'; }).join('');
    chips = chips ? '<div class="chips">'+chips+'<\/div>' : '';
    if(!aq.trim()){
      box.innerHTML=head+'<div class="pv-hint">Per 100g: '+R(food.cal)+' kcal &middot; P '+R1(food.p)+'g &middot; net C '+R1(food.c-food.fi)+'g &middot; F '+R1(food.f)+'g.'+pieceNote(food)+' Now enter an amount.<\/div>'+chips;
      return;
    }
    var amt=parseAmount(aq,food);
    if(!amt){
      box.innerHTML=head+'<div class="pv-miss">Amount not understood. Try 179, 6oz, 1lb'+(food.pc?', or 4x':'')+'.<\/div>'+chips;
      return;
    }
    var mac=foodMacros(food,amt.g), t=calcTargets(state.profile), tot=dayTotals(state.days[viewDate]||[]);
    var left=t.calorieTarget-tot.cals-mac.cals, prot=tot.protein+mac.protein, net=tot.carbs-tot.fiber+mac.carbs-mac.fiber;
    function cell(v,k){ return '<div class="pv-cell"><div class="v">'+v+'<\/div><div class="k">'+k+'<\/div><\/div>'; }
    box.innerHTML=head+'<div class="pv-sub">'+esc(amt.label)+'<\/div>' +
      '<div class="pv-grid">'+cell(R(mac.cals),'kcal')+cell(R1(mac.protein)+'g','protein')+cell(R1(mac.carbs-mac.fiber)+'g','net carbs')+cell(R1(mac.fat)+'g','fat')+'<\/div>' +
      '<div class="pv-after">After logging: protein <b>'+R(prot)+'<\/b> / '+R(t.proteinG)+'g &middot; <b>'+N(left)+'<\/b> kcal left &middot; net carbs <b>'+R1(net)+'<\/b> / '+R(t.netCarbG)+'g<\/div>'+chips;
  }

  function render(){
    $('app-root').innerHTML = renderApp(state, viewDate);
    updatePreview();
  }

  // Each viewer gets a private copy: data/users/<id>/ in the artifact db, plus this browser as a fallback.
  var dbRef = null, writing = false, dirty = false, touched = false;
  function saveRemote(){
    if(!dbRef) return;
    if(writing){ dirty = true; return; }
    writing = true;
    dbRef.set({json: JSON.stringify(state), updated: Date.now()})
      .catch(function(err){ console.warn('Cutline: save failed', err); })
      .then(function(){ writing = false; if(dirty){ dirty = false; saveRemote(); } });
  }
  if(window.claude && window.claude.use){
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
      var db = r[0], user = r[1];
      if(!db || !user) return;
      return user.id().then(function(id){
        if(!id) return;
        var ref = db.collection('data/users/' + id).doc('cutline');
        return ref.get().then(function(snap){
          var v = snap && typeof snap.data === 'function' ? snap.data() : snap;
          dbRef = ref;
          if(v && v.json && !touched){
            adopt(JSON.parse(v.json));
            if(!state.days[viewDate]) state.days[viewDate] = [];
            try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
            render();
          } else if(touched || Object.keys(state.days).some(function(d){ return state.days[d].length; })){
            saveRemote();
          }
        });
      });
    }).catch(function(err){ console.warn('Cutline: account storage unavailable', err); });
  }

  function persist(){
    touched = true;
    render();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    saveRemote();
  }

  document.addEventListener('input', function(ev){
    if(ev.target && (ev.target.id==='f-food' || ev.target.id==='f-amt')) updatePreview();
  });

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');
    if(action==='prev-day'){ viewDate = shiftDate(viewDate,-1); if(!state.days[viewDate]) state.days[viewDate]=[]; render(); }
    else if(action==='next-day'){ viewDate = shiftDate(viewDate,1); if(!state.days[viewDate]) state.days[viewDate]=[]; render(); }
    else if(action==='goto-day'){
      viewDate = t.getAttribute('data-date');
      if(!state.days[viewDate]) state.days[viewDate]=[];
      render();
      window.scrollTo(0,0);
    }
    else if(action==='del-entry'){
      var id = t.getAttribute('data-id');
      state.days[viewDate] = (state.days[viewDate]||[]).filter(function(e){ return e.id!==id; });
      persist();
    }
    else if(action==='del-custom'){
      var i = parseInt(t.getAttribute('data-i'),10);
      if(i>=0 && i<state.customFoods.length){ state.customFoods.splice(i,1); persist(); }
    }
    else if(action==='pick-food'){
      $('f-food').value = t.getAttribute('data-name');
      updatePreview();
      $('f-amt').focus();
    }
    else if(action==='pick-usual'){
      $('f-food').value = t.getAttribute('data-name');
      $('f-amt').value = t.getAttribute('data-amt');
      updatePreview();
      $('f-amt').focus();
    }
  });

  document.addEventListener('change', function(ev){
    var t = ev.target.closest('[data-field]');
    if(!t) return;
    var field = t.getAttribute('data-field');
    if(t.type==='checkbox'){ state.profile[field] = t.checked; persist(); return; }
    var val = t.value;
    if(field==='sex' || field==='dietMode'){ state.profile[field] = val; }
    else if(field==='activity'){ state.profile.activity = parseFloat(val); }
    else if(field==='age'){ state.profile.age = val? parseInt(val,10) : null; }
    else { state.profile[field] = parseFloat(val)||0; }
    if(field==='weightLb' && state.profile.weightLb>0){ state.weights[todayStr()] = state.profile.weightLb; }
    persist();
  });

  document.addEventListener('submit', function(ev){
    var form = ev.target.closest('[data-action]');
    if(!form) return;
    var action = form.getAttribute('data-action');
    if(action==='add-entry'){
      ev.preventDefault();
      var food = findFoods($('f-food').value)[0];
      if(!food){ updatePreview(); return; }
      if(!$('f-amt').value.trim()){ $('f-amt').focus(); updatePreview(); return; }
      var amt = parseAmount($('f-amt').value, food);
      if(!amt){ updatePreview(); return; }
      var mac = foodMacros(food, amt.g);
      if(!state.days[viewDate]) state.days[viewDate]=[];
      state.days[viewDate].push({
        id: 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        name: food.n, portion: amt.label,
        cals: R1(mac.cals), protein: R1(mac.protein), carbs: R1(mac.carbs), fiber: R1(mac.fiber), fat: R1(mac.fat)
      });
      persist();
      $('f-food').focus();
    }
    else if(action==='add-custom'){
      ev.preventDefault();
      var fd = new FormData(form), name = (fd.get('name')||'').trim();
      var serv = parseFloat(fd.get('serving'));
      if(!name || !(serv>0)) return;
      var k = 100/serv;
      state.customFoods.push({n:name, a:[], cal:(parseFloat(fd.get('cal'))||0)*k, p:(parseFloat(fd.get('protein'))||0)*k, c:(parseFloat(fd.get('carbs'))||0)*k, fi:(parseFloat(fd.get('fiber'))||0)*k, f:(parseFloat(fd.get('fat'))||0)*k, pc:{name:'serving', g:serv}});
      persist();
      $('f-food').value = name;
      updatePreview();
      $('f-amt').focus();
    }
  });

  render();
})(JSON.parse(document.getElementById('state-data').textContent));</script></body></html>
